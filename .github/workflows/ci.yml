name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Install client deps
        run: npm ci
        working-directory: client

      - name: Lint server
        run: npm run lint
        working-directory: server

      - name: Lint client
        run: npm run lint
        working-directory: client

      - name: Test server
        run: npm test -- --reporter=verbose --reporter=junit --outputFile=test-results.xml
        working-directory: server

      - name: Test client
        run: npm test -- --reporter=verbose --reporter=junit --outputFile=test-results.xml
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            server/test-results.xml
            client/test-results.xml

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: 'server/test-results.xml,client/test-results.xml'
          reporter: java-junit
          fail-on-error: false
