name: E2E

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  checks: write
  contents: write

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Poll the Render API until the new commit is live (up to 10 min).
      - name: Wait for Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Waiting for Render to deploy commit ${COMMIT_SHA:0:7}…"
          for i in $(seq 1 30); do
            response=$(curl -sf \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1")
            status=$(echo "$response" | jq -r '.[0].deploy.status')
            commit=$(echo "$response" | jq -r '.[0].deploy.commit.id')
            echo "  attempt $i/30 — status=$status commit=${commit:0:7}"
            if [ "$status" = "live" ] && [ "$commit" = "$COMMIT_SHA" ]; then
              echo "Backend is live!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Timed out waiting for Render deploy"
              exit 1
            fi
            sleep 20
          done

      - name: Wake up Render backend
        run: |
          echo "Waiting for backend HTTP health check…"
          for i in $(seq 1 18); do
            if curl -sf --max-time 10 https://groupz-j717.onrender.com/health > /dev/null; then
              echo "Backend is responding!"
              break
            fi
            echo "  attempt $i/18 — not ready, retrying in 10s…"
            if [ $i -eq 18 ]; then
              echo "Backend never responded — tests will likely fail"
            fi
            sleep 10
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install client deps
        run: npm ci
        working-directory: client

      - name: Install report tools
        run: npm install --no-save mochawesome mochawesome-merge mochawesome-report-generator
        working-directory: client

      - name: Run Cypress against production
        id: cypress
        run: |
          npx cypress run \
            --browser chrome \
            --config "baseUrl=https://groupz-seven.vercel.app,screenshotOnRunFailure=true,video=false" \
            --reporter mochawesome \
            --reporter-options "reportDir=cypress/reports,overwrite=false,html=false,json=true"
        working-directory: client
        continue-on-error: true
        env:
          CYPRESS_BACKEND_URL: https://groupz-j717.onrender.com

      - name: Generate HTML report
        if: always()
        continue-on-error: true
        run: |
          npx mochawesome-merge cypress/reports/mochawesome*.json -o cypress/reports/report.json
          npx marge cypress/reports/report.json --reportDir cypress/reports --inline
        working-directory: client

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-report
          path: client/cypress/reports/report.html

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: steps.cypress.outcome == 'failure'
        with:
          name: cypress-screenshots
          path: client/cypress/screenshots/

      - name: Publish E2E test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Tests
          path: 'client/cypress/reports/mochawesome*.json'
          reporter: mochawesome
          fail-on-error: false

      # Rollback intentionally disabled.
      # When active, each E2E failure pushed a revert commit to main, causing
      # Render to deploy a new SHA. The "Wait for Render deploy" step then timed
      # out looking for the original SHA, so Cypress never ran, triggering
      # another rollback — an infinite loop. Re-enable only after confirming
      # the Render SHA-match logic handles rollback commits gracefully.
      # - name: Rollback on E2E failure
      #   if: steps.cypress.outcome == 'failure'
      #   run: |
      #     git config user.email "github-actions@github.com"
      #     git config user.name "GitHub Actions"
      #     git revert HEAD --no-edit
      #     git push origin main

      - name: Fail job if Cypress failed
        if: steps.cypress.outcome == 'failure'
        run: |
          echo "E2E tests failed"
          exit 1
