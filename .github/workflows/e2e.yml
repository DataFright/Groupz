name: E2E

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  checks: write
  contents: write

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Poll the Render API until the new commit is live (up to 10 min).
      - name: Wait for Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Waiting for Render to deploy commit ${COMMIT_SHA:0:7}…"
          for i in $(seq 1 30); do
            response=$(curl -sf \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1")
            status=$(echo "$response" | jq -r '.[0].deploy.status')
            commit=$(echo "$response" | jq -r '.[0].deploy.commit.id')
            echo "  attempt $i/30 — status=$status commit=${commit:0:7}"
            if [ "$status" = "live" ] && [ "$commit" = "$COMMIT_SHA" ]; then
              echo "Backend is live!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Timed out waiting for Render deploy"
              exit 1
            fi
            sleep 20
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install client deps
        run: npm ci
        working-directory: client

      - name: Install report tools
        run: npm install --no-save mochawesome mochawesome-merge mochawesome-report-generator
        working-directory: client

      - name: Run Cypress against production
        id: cypress
        run: |
          npx cypress run \
            --config "baseUrl=https://groupz-seven.vercel.app,screenshotOnRunFailure=true,video=false" \
            --reporter mochawesome \
            --reporter-options "reportDir=cypress/reports,overwrite=false,html=false,json=true"
        working-directory: client
        continue-on-error: true
        env:
          CYPRESS_BACKEND_URL: https://groupz-j717.onrender.com

      - name: Generate HTML report
        if: always()
        run: |
          npx mochawesome-merge cypress/reports/mochawesome*.json -o cypress/reports/report.json
          npx marge cypress/reports/report.json --reportDir cypress/reports --inline
        working-directory: client

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-report
          path: client/cypress/reports/report.html

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: always() && steps.cypress.outcome == 'failure'
        with:
          name: cypress-screenshots
          path: client/cypress/screenshots/

      # Revert the bad commit so Render + Vercel automatically re-deploy the
      # previous working version. Pushes via GITHUB_TOKEN do not re-trigger
      # GitHub Actions workflows, preventing an infinite loop.
      - name: Rollback on E2E failure
        if: always() && steps.cypress.outcome == 'failure'
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git revert HEAD --no-edit
          git push origin main

      - name: Fail job after rollback
        if: always() && steps.cypress.outcome == 'failure'
        run: |
          echo "E2E tests failed — rollback pushed to main"
          exit 1
