services:
  server:
    build:
      context: ./server
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      CLIENT_ORIGIN: http://localhost:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
